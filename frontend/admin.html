<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadSight — Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    #map { height: 400px; }
    .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
    .report-card { transition: background 0.15s; }
    .report-card:hover { background: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#667eea,#764ba2)">
          <i class="fa-solid fa-road text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-gray-800 leading-none">RoadSight Admin</h1>
          <p class="text-xs text-gray-400 mt-0.5">
            Logged in as <strong id="admin-email">—</strong>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="lastUpdated" class="text-xs text-gray-400 hidden sm:block"></span>
        <a href="/admin/logout" class="inline-flex items-center gap-1 text-sm text-red-500 hover:text-red-700 font-medium">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-5 space-y-5">

    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="stat-card bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-chart-bar text-blue-600 text-lg"></i>
        </div>
        <div>
          <div class="text-xs text-gray-400 uppercase tracking-wide font-medium">Total</div>
          <div id="stat-total" class="text-2xl font-bold text-gray-800">—</div>
        </div>
      </div>
      <div class="stat-card bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-triangle-exclamation text-red-500 text-lg"></i>
        </div>
        <div>
          <div class="text-xs text-gray-400 uppercase tracking-wide font-medium">High Priority</div>
          <div id="stat-high" class="text-2xl font-bold text-red-600">—</div>
        </div>
      </div>
      <div class="stat-card bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-clock text-amber-500 text-lg"></i>
        </div>
        <div>
          <div class="text-xs text-gray-400 uppercase tracking-wide font-medium">Pending</div>
          <div id="stat-pending" class="text-2xl font-bold text-amber-600">—</div>
        </div>
      </div>
      <div class="stat-card bg-white rounded-xl shadow-sm p-4 border border-gray-100 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-circle-check text-green-500 text-lg"></i>
        </div>
        <div>
          <div class="text-xs text-gray-400 uppercase tracking-wide font-medium">Resolved</div>
          <div id="stat-resolved" class="text-2xl font-bold text-green-600">—</div>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <section class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
      <div class="flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Severity</label>
          <select id="filter-severity" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">All</option>
            <option value="critical">Critical</option>
            <option value="poor">Poor</option>
            <option value="moderate">Moderate</option>
            <option value="good">Good</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Status</label>
          <select id="filter-status" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">All</option>
            <option>New</option>
            <option>Scheduled</option>
            <option>In Progress</option>
            <option>Resolved</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Sort</label>
          <select id="filter-sort" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="newest">Priority + Newest</option>
            <option value="oldest">Priority + Oldest</option>
          </select>
        </div>
        <button id="refresh" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 text-sm font-medium transition">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh
        </button>
        <span id="reportCount" class="ml-auto text-sm text-gray-400 self-center"></span>
      </div>
    </section>

    <!-- Map + List -->
    <section class="grid grid-cols-1 lg:grid-cols-5 gap-4">

      <!-- Map -->
      <div class="lg:col-span-3 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-2">
          <i class="fa-solid fa-map-location-dot text-blue-500"></i>
          <h2 class="font-semibold text-gray-700 text-sm">Damage Map</h2>
        </div>
        <div id="map"></div>
        <div class="px-4 py-2 bg-gray-50 border-t border-gray-100 flex items-center gap-5 text-xs text-gray-500">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>High</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span>Medium</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>Low</span>
        </div>
      </div>

      <!-- Report List -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-2">
          <i class="fa-solid fa-list text-blue-500"></i>
          <h2 class="font-semibold text-gray-700 text-sm">Reports</h2>
        </div>
        <div id="report-list" class="overflow-y-auto divide-y divide-gray-50 flex-1" style="max-height:440px;"></div>
      </div>

    </section>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden items-start justify-center p-4 pt-16 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full">
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <h3 class="font-bold text-gray-800">Report Details</h3>
        <button id="closeModal" class="text-gray-400 hover:text-gray-700 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div id="modalBody" class="p-6 space-y-4"></div>
    </div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
