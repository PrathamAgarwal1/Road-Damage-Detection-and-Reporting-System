# Render blueprint for the RoadSight API (New > Blueprint in the Render dashboard).
services:
  - type: web
    name: roadsight-backend
    runtime: python
    # CPU-only PyTorch: the default Linux wheel pulls ~2 GB of CUDA libraries Render can't use.
    buildCommand: >-
      pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    # One worker keeps a single copy of the models in memory; threads handle concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALERT_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
